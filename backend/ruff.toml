# Ruff configuration for Greppa
# See: https://docs.astral.sh/ruff/

# Same as Black's line length
line-length = 120

# Assume Python 3.10+
target-version = "py310"

[lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (common bugs)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PL",  # pylint
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value in comparison
    "N805",    # First argument should be self/cls (conflicts with Pydantic)
    "ARG002",  # Unused method argument (common in overrides)
    "PTH123",  # Use pathlib instead of os.path (gradual migration)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    "alembic/versions",  # Don't lint auto-generated migration files
    "build",
    "dist",
]

[lint.per-file-ignores]
# Ignore import sorting in __init__.py files
"__init__.py" = ["F401", "I001"]
# Ignore unused imports in test files (fixtures, etc.)
"test_*.py" = ["F401", "ARG001"]
"tests/*.py" = ["F401", "ARG001"]

[lint.isort]
# Configure import sorting to match common Python standards
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[lint.pylint]
# Configure pylint rules
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing comma
skip-magic-trailing-comma = false

# Unix line endings
line-ending = "lf"
